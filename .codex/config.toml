# Start Codex at the repository root. The launcher uses $IQC_PYTHON, then
# .venv/bin/python, then python3/python on PATH (see docs/mcp.md).
[mcp_servers.iqc]
command = "sh"
args = ["scripts/run_mcp_server.sh"]
startup_timeout_sec = 30
tool_timeout_sec = 600

[mcp_servers.iqc.env]
IQC_DISABLE_MPI = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
