[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iqc"
version = "0.1.0"
description = "IQC: Interactive Quantum Chemistry"
authors = [
    {name = "Murat Keceli", email = "keceli@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "argcomplete",
    "numpy",
    "mpi4py",
    "psutil",
    "ase",
    "rdkit",
    "matplotlib",
    "nglview",
    "pandas",
    "pyarrow",
    "openpyxl",
    "xlrd",
    "pymatgen",
    "pubchempy",
    # Keep e3nn unpinned for UMA/fairchem compatibility. MACE metadata pins
    # e3nn==0.4.4, so install mace-torch separately with --no-deps.
    "e3nn>=0.5",
]

[project.optional-dependencies]
mlip = [
    "fairchem-core>=2.0; python_version >= '3.11'",
    "pydantic>=2.12,<3",
    "torch-dftd",
    "torch-ema",
    "prettytable",
    "matscipy",
    "h5py",
    "torchmetrics",
    "python-hostlist",
    "configargparse",
    "GitPython",
    "PyYAML",
    "tqdm",
    "lmdb",
    "orjson",
    "opt_einsum",
]
xtb = [
    "xtb",
]
test = [
    "pytest>=7.0",
    "pytest-mock",
]
dev = [
    "black",
    "isort",
    "flake8",
]

[tool.setuptools.packages.find]
include = ["iqc*"]
exclude = ["iqc.tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["iqc/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 

[project.scripts]
iqc = "iqc.main:main"
