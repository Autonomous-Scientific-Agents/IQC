name: iqc-env
channels:
  - conda-forge
  - auto-mech
  - pytorch
dependencies:
  - python=3.12
  - psutil
  - ase
  - rdkit
  - matplotlib
  - automech
  - pytorch::pytorch
  - pytorch::cpuonly
  - xtb-python
  - jupyterlab
  - ipywidgets
  - mpi4py
  - pip
  - pip:
      - e3nn>=0.5
      - torch-dftd
      - torch-ema
      - prettytable
      - matscipy
      - h5py
      - torchmetrics
      - python-hostlist
      - configargparse
      - GitPython
      - PyYAML
      - tqdm
      - lmdb
      - orjson
      - opt_einsum
      - nglview
      - pubchempy
      - pydantic>=2.12,<3
      - fairchem-core
      # Install mace-torch after creating the environment:
      # python -m pip install --no-deps mace-torch
